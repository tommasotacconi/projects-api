services:
  laravel:
    build:
      context: .
      dockerfile: containers/laravel/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - vendor_data:/app/vendor
    ports:
      - '8000:8000'
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db

  vite:
    build:
      context: .
      dockerfile: containers/vite/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '5174:5174'
    command: npm run dev

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  vendor_data:
